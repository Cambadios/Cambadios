name: generate animation

on:
  schedule:
    - cron: "0 */12 * * *"   # se actualiza automáticamente cada 12 horas
  workflow_dispatch: {}       # también podés lanzarla manualmente desde la pestaña Actions
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generar github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: Cambadios
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: subir el svg a la rama "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
